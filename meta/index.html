<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta - Sancho Syquia</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../style.css" />
  <script src="../global.js" type="module"></script>
  <script src="main.js" type="module"></script>
</head>
<body>
  <main>
    <h1>Code Meta-Analysis</h1>
    <p>
      A quantitative view of this portfolio's source code, generated from Git
      history and visualized with D3.
    </p>

    <div class="commit-filter">
      <label for="commit-progress">Show commits until:</label>
      <input id="commit-progress" type="range" min="0" max="100" step="any" value="100" />
      <time id="commit-time"></time>
    </div>

    <div id="stats"></div>

    <section id="scrolly-1" class="scrolly-story">
      <div id="scatter-story">
        <h2>Evolution over time</h2>
      </div>
      <div id="scatter-plot">
        <h2>Commits by time of day</h2>
        <div id="chart"></div>
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </div>
    </section>

    <section id="scrolly-2" class="file-scrolly-story">
      <div id="file-plot">
        <h2>Files by Lines of Code</h2>
        <dl id="files"></dl>
      </div>
      <div id="file-story">
        <h2>Commits</h2>
      </div>
    </section>

    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd>
        <a href="" id="commit-link" target="_blank" rel="noreferrer noopener"></a>
      </dd>

      <dt>Date</dt>
      <dd id="commit-date"></dd>

      <dt>Time</dt>
      <dd id="tooltip-commit-time"></dd>

      <dt>Author</dt>
      <dd id="commit-author"></dd>

      <dt>Lines edited</dt>
      <dd id="commit-lines"></dd>
    </dl>
  </main>
</body>
</html>
