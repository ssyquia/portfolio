<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects - Sancho Syquia</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="../global.js" type="module"></script>
  <script src="projects.js" type="module" defer></script>
</head>
<body>
  <main>
    <h1 class="projects-title">
      Projects and Awards <span class="projects-count"></span>
    </h1>

    <section class="projects-visualization" aria-label="Projects by year">
      <div class="chart-container">
        <svg id="projects-pie-plot" viewBox="-50 -50 100 100" role="img" aria-label="Pie chart of projects by year"></svg>
        <ul class="legend"></ul>
      </div>
    </section>

    <input
      class="searchBar"
      type="search"
      aria-label="Search projects"
      placeholder="Search projects..."
    />

    <section class="projects">
      <!-- Project cards are rendered dynamically from ../lib/projects.json -->
    </section>
  </main>
</body>
</html>
