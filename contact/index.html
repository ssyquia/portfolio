<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Sancho Syquia</title>
  <link rel="stylesheet" href="../style.css" />
  <script src="../global.js" type="module"></script>
</head>
<body>
  <main>
    <h1>Contact</h1>
    <p>Send me a message using the form below.</p>

    <form action="mailto:ssyquia@ucsd.edu" method="GET">
      <label>
        <span>Your email</span>
        <input name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
      </label>

      <label>
        <span>Subject</span>
        <input name="subject" placeholder="Hello from your website" required />
      </label>

      <label>
        <span>Message</span>
        <textarea name="body" rows="6" placeholder="Hi Sancho, I found your portfolio and wanted to connect." required></textarea>
      </label>

      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
